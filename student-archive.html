<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private student archive | HelloEarth</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3f9;color:#29253b;font:15px system-ui,sans-serif}header{background:#33274d;color:white;padding:18px 5vw;display:flex;align-items:center;gap:16px;flex-wrap:wrap}header a{color:white}main{max-width:1200px;margin:auto;padding:24px 16px}h1{font-size:25px;margin:0 0 10px}p{line-height:1.6}input,button{font:inherit;border:1px solid #c9c2d7;border-radius:8px;padding:10px;background:white;color:inherit}input{width:100%}button{cursor:pointer}button:hover,button:focus-visible{background:#e8ddf8}#grid{display:grid;grid-template-columns:minmax(200px,320px) minmax(0,1fr);gap:16px;margin-top:16px}#files,#viewer{background:white;border:1px solid #ddd7e8;border-radius:12px;padding:16px;min-width:0}#files button{display:block;width:100%;text-align:left;margin:5px 0;overflow-wrap:anywhere}#files button[aria-current=true]{background:#e8ddf8}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font:14px/1.65 system-ui,sans-serif}#filename{overflow-wrap:anywhere}#files{max-height:75vh;overflow:auto}@media(max-width:720px){#grid{grid-template-columns:1fr}#files{max-height:38vh}}
</style></head><body><header><a href="dashboard.html">← Dashboard</a><strong>HelloEarth · Private archive</strong></header><main><h1>Imported student information</h1><p>Original source records, assessment files and teaching material. Historical content is not proof of attendance or achievement.</p><input id="search" type="search" placeholder="Search by file name or contents" aria-label="Search private archive"><p id="status" role="status">Checking your account…</p><div id="grid"><nav id="files" aria-label="Archive files"></nav><article id="viewer"><h2 id="filename">Choose a file</h2><button id="download" disabled>Download source text</button><pre id="body"></pre></article></div></main><script type="module">
import {db} from "./supabase-client.js";
const el=id=>document.getElementById(id);let files=[],active=null;
function render(){const q=el("search").value.trim().toLowerCase();const results=files.filter(f=>!q||f.source_path.toLowerCase().includes(q)||f.content.toLowerCase().includes(q));el("files").replaceChildren();for(const f of results){const b=document.createElement("button");b.textContent=f.source_path;b.setAttribute("aria-current",String(active===f));b.onclick=()=>{active=f;el("filename").textContent=f.source_path;el("body").textContent=f.content;el("download").disabled=false;render()};el("files").append(b)}el("status").textContent=results.length+" of "+files.length+" private files"}
el("search").addEventListener("input",render);el("download").onclick=()=>{if(!active)return;const url=URL.createObjectURL(new Blob([active.content],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download=active.source_path.split("/").pop();a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
async function load(){const {data:{user},error:authError}=await db.auth.getUser();if(authError||!user){location.replace("login.html");return}const {data,error}=await db.from("he_tutor_source_archive").select("source_path,content").eq("tutor_id",user.id).order("source_path");if(error){el("status").textContent="Archive unavailable: "+error.message;return}files=data||[];render()}
db.auth.onAuthStateChange((event)=>{if(event==="SIGNED_OUT"){files=[];active=null;el("body").textContent="";el("filename").textContent="Choose a file";el("download").disabled=true;render();location.replace("login.html")}});
load().catch(()=>{el("status").textContent="Unable to load archive. Refresh to retry."});
</script></body></html>
