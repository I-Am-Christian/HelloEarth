<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#17233b"><title>Private lesson report | HelloEarth</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="helloearth-lesson.css?v=20261126-first1">
<script type="module" src="helloearth-report-preview.js?v=20261126-report1"></script>
<link rel="stylesheet" href="page-i18n.css?v=20261126-all1"><script src="site-translation.js?v=20261126-all1" defer></script><script src="page-i18n.js?v=20261126-all1" defer></script></head>
<body>
<header class="lesson-toolbar">
  <a href="dashboard.html#reports" class="toolbar-brand">✦ HelloEarth <span>Lesson Reports</span></a>
  <div class="lesson-toolbar-actions">
    <span id="lesson-life" class="lesson-life">Private tutor report</span>
    <button id="lesson-copy" type="button" disabled>Copy report</button>
    <button id="lesson-download" type="button" disabled>Download .md</button>
    <button id="lesson-print" class="primary" type="button" disabled>Print / Save PDF</button>
  </div>
</header>
<main class="lesson-screen"><section class="lesson-paper" aria-label="Printable student progress report">
<header class="paper-top">
 <div class="paper-identity"><div class="paper-brand">✦ helloearth<span>.</span></div><div class="paper-kicker">TEACHING INSIGHTS</div></div>
 <div class="paper-identity-tag">PRIVATE REPORT</div>
</header>
<div id="lesson-error" class="lesson-error" role="alert" hidden></div>
<div class="paper-topic"><p class="paper-small">LESSON REFLECTION</p><h1 id="lesson-title">Opening your report…</h1>
<div class="paper-pills"><span id="lesson-level">Transcript-based</span><span id="lesson-duration">Not scored</span><span id="lesson-date">Prepared lesson report</span></div></div>
<article id="lesson-content" class="workbook-body"></article>
<footer class="paper-footer"><span>HelloEarth · Tutor-private report</span><span>Review AI findings before using with a student</span></footer>
</section></main>
<div id="lesson-status" class="screen-status" role="status" aria-live="polite"></div>
</body></html>
