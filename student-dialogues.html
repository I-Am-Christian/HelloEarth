<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Saved dialogues | HelloEarth</title><link rel="icon" href="logo.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#18233d;color:#f4efff;font:14px/1.5 system-ui}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:15px clamp(12px,3vw,32px);background:#26314e}a{color:#dfcaff;text-decoration:none}main{max-width:1060px;margin:auto;padding:20px 14px 60px}h1{font-size:25px;margin:0 0 8px}h2{font-size:17px}label{display:flex;align-items:center;gap:8px;margin:16px 0}select,button{background:#343e5e;color:#f4efff;border:1px solid #a28cbf;border-radius:8px;padding:8px 11px;font:inherit}button{cursor:pointer}button:disabled{opacity:.45}#list{display:grid;gap:8px}details{background:#26314c;border:1px solid #a28cbf55;border-radius:10px;padding:12px}summary{cursor:pointer;font-weight:650}.actions{display:flex;gap:8px;margin:10px 0}.row{padding:10px;border-top:1px solid #a28cbf33}.row small{color:#b9adcf}.row p{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0}.translated{color:#dfcaff}#status{color:#e3cffa}.muted{opacity:.75;font-size:12px}select{min-width:0;max-width:100%}
</style></head><body><header><strong>✦ HelloEarth · Dialogue history</strong><a href="dashboard.html#students">← Back to Students</a></header><main><h1>Saved classroom dialogues</h1><p class="muted">Private speaker-labelled transcripts and translations. Automated speech recognition and translation may be inaccurate.</p><label>Student <select id="students"><option value="">Choose a student</option></select></label><p id="status" role="status">Checking secure session…</p><div id="list" translate="no"></div></main><script type="module">
import {db} from "./supabase-client.js";
const el=id=>document.getElementById(id),select=el("students"),list=el("list"),status=el("status");let owner="",request=0;
function n(tag,text="",cls=""){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
function download(record){const text=(record.transcript||[]).map(r=>new Date(r.at).toLocaleTimeString()+" "+r.speaker+" ["+r.language+"]\n"+(r.text||"[Untranscribed segment]")+(r.translation?"\nTranslation: "+r.translation:"")).join("\n\n");const url=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"})),a=document.createElement("a");a.href=url;a.download="classroom-dialogue.txt";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function load(){const run=++request,id=select.value;list.replaceChildren();if(!id){status.textContent="Choose a student.";return}status.textContent="Loading dialogues…";const {data,error}=await db.from("he_classroom_dialogues").select("id,topic,student_language,started_at,ended_at").eq("tutor_id",owner).eq("student_id",id).order("started_at",{ascending:false}).limit(100);if(run!==request)return;if(error){status.textContent="Could not load dialogues: "+error.message;return}status.textContent=data.length?data.length+" saved dialogue(s)":"No dialogues saved yet.";
for(const record of data){const item=n("details"),summary=n("summary",record.topic+" · "+new Date(record.started_at).toLocaleString()+(record.ended_at?"":" · Incomplete session"));const body=n("div"),actions=n("div","","actions"),get=n("button","Download dialogue"),del=n("button","Delete dialogue");get.disabled=true;actions.append(get,del);item.append(summary,actions,body);list.append(item);let full=null;item.addEventListener("toggle",async()=>{if(!item.open||full)return;body.textContent="Loading transcript…";const {data,error}=await db.from("he_classroom_dialogues").select("transcript").eq("id",record.id).eq("tutor_id",owner).eq("student_id",id).single();if(error){body.textContent=error.message;return}full={...record,...data};get.disabled=false;body.replaceChildren();for(const r of full.transcript||[]){const row=n("article","","row");row.append(n("small",r.speaker+" · "+new Date(r.at).toLocaleTimeString()),n("p",r.text||"[Audio not transcribed]"));if(r.translation)row.append(n("p",r.translation,"translated"));if(r.translationError)row.append(n("small",r.translationError));body.append(row)}if(!body.children.length)body.textContent="No speech segments saved."});get.onclick=()=>{if(full)download(full)};del.onclick=async()=>{if(!confirm("Delete this private dialogue permanently?"))return;const {error}=await db.from("he_classroom_dialogues").delete().eq("id",record.id).eq("tutor_id",owner);if(error)status.textContent=error.message;else load()}}
}
try{const {data:{user},error}=await db.auth.getUser();if(error||!user){location.replace("login.html");throw Error("Sign in required")}owner=user.id;const {data,error:readError}=await db.from("atlas_students").select("id,display_name").eq("tutor_id",owner).order("display_name");if(readError)throw readError;for(const s of data)select.add(new Option(s.display_name,s.id));const selected=new URLSearchParams(location.search).get("student");if(data.some(s=>s.id===selected))select.value=selected;select.addEventListener("change",load);await load()}catch(e){status.textContent=e.message}
</script></body></html>
